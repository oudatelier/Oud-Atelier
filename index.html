<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oud Atelier — Parfums d'exception</title>

  <meta
    name="description"
    content="Oud Atelier — Parfums d'exception. Découvrez notre sélection de parfums et commandez en ligne."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: #fff;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    a {
      color: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.95);
      border-bottom: 1px solid #222;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .cart-button {
      border: 1px solid #444;
      background: #151515;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .cart-button:hover {
      background: #222;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      background:
        radial-gradient(circle at center, #18352b 0%, #0d1714 35%, #090909 75%);
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 78px);
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    .hero p {
      color: #ccc;
      font-size: 19px;
      margin-bottom: 30px;
    }

    .hero-button {
      display: inline-block;
      background: white;
      color: #000;
      padding: 14px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 70px 20px;
    }

    .section-title {
      text-align: center;
      font-size: 34px;
      margin-bottom: 12px;
    }

    .section-subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 35px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      max-width: 600px;
      margin: 0 auto 40px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #141414;
      color: white;
      outline: none;
    }

    .search-box input:focus {
      border-color: #777;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product-card {
      background: #121212;
      border: 1px solid #222;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #555;
    }

    .product-image {
      height: 230px;
      background:
        radial-gradient(circle at center, #25483b, #111 65%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
    }

    .product-info {
      padding: 18px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      min-height: 50px;
    }

    .size-select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #1b1b1b;
      border: 1px solid #333;
      color: white;
      border-radius: 8px;
    }

    .product-price {
      color: #ddd;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .quantity-row button {
      width: 35px;
      height: 35px;
      border: 1px solid #444;
      background: #1d1d1d;
      color: white;
      border-radius: 7px;
      cursor: pointer;
    }

    .quantity-value {
      min-width: 30px;
      text-align: center;
    }

    .add-button {
      width: 100%;
      padding: 12px;
      background: white;
      color: black;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-button:hover {
      background: #ddd;
    }

    /* =========================
       ORDER
    ========================= */

    .order-section {
      background: #0e0e0e;
      border-top: 1px solid #1e1e1e;
      border-bottom: 1px solid #1e1e1e;
    }

    .order-container {
      max-width: 800px;
      margin: auto;
      padding: 70px 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-weight: bold;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #161616;
      color: white;
      outline: none;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .delivery-box {
      background: #151515;
      border: 1px solid #292929;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .delivery-option {
      display: flex;
      gap: 10px;
      margin: 10px 0;
      align-items: center;
      cursor: pointer;
    }

    .order-summary {
      background: #151515;
      padding: 20px;
      border-radius: 12px;
      margin: 25px 0;
    }

    .order-summary h3 {
      margin-bottom: 15px;
    }

    .order-total {
      border-top: 1px solid #333;
      margin-top: 15px;
      padding-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .submit-order {
      width: 100%;
      padding: 16px;
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 17px;
    }

    .submit-order:hover {
      background: #ddd;
    }

    /* =========================
       BOUTIQUE
    ========================= */

    .boutique-section {
      padding: 70px 20px;
      background: #0b0b0b;
    }

    .boutique-container {
      max-width: 1100px;
      margin: auto;
    }

    .boutique-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .boutique-title h2 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .boutique-title p {
      color: #999;
    }

    .boutique-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
    }

    .address-card {
      background: #151515;
      border-radius: 18px;
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .address-label {
      color: #999;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .address-card h3 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .address-card p {
      color: #ddd;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .maps-button {
      display: block;
      text-align: center;
      padding: 14px 20px;
      background: white;
      color: black;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .map-container {
      min-height: 390px;
      border-radius: 18px;
      overflow: hidden;
      background: #151515;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      min-height: 390px;
      border: 0;
      display: block;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #050505;
