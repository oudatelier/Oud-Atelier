<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oud Atelier — Parfums d'exception</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #12372a;
      color: #f5f1e8;
    }

    header {
      background: #17130f;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .cart {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .hero {
      min-height: 430px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: #0b241b;
    }

    .hero h1 {
      font-size: 48px;
      letter-spacing: 5px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .button {
      background: #17130f;
      color: white;
      padding: 13px 25px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }
    .button {
  transition: 0.3s;
}

.button:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

    .section {
      padding: 45px 20px;
      max-width: 1200px;
      margin: auto;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .product {
      background: white;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }
    .product {
  transition: 0.3s;
}

.product:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
}

    .product-image {
      height: 230px;
      background: #eee7dd;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      margin-bottom: 15px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 15px;
    }

    .product button {
      width: 100%;
    }

    #cartPanel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
    }

    .cart-box {
      background: black;
      width: min(500px, 94%);
      max-height: 90vh;
      overflow-y: auto;
      margin: 5vh auto;
      padding: 25px;
      border-radius: 10px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .close {
      float: right;
      border: none;
      background: none;
      color: red;
      font-size: 25px;
      cursor: pointer;
    }

    form {
      margin-top: 25px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    footer {
      background: #17130f;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 35px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">OUD ATELIER</div>

  <button class="cart" onclick="openCart()">
    🛒 Panier (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">

  <p>Parfums d'exception</p>
  <button class="button" onclick="document.getElementById('products').scrollIntoView()">

</section>

<section class="section" id="products">

      <button class="button" onclick="addToCart('Ombre Nomade', 2500)">

    </div>

    <div class="product">

      <button class="button" onclick="addToCart('Angel\\'s Share', 2500)">
        Ajouter au panier
      </button>

    <div class="product">

      <h3>Hacivat</h3>

      </button>

    <div class="product">
      <div class="product-image">🧴</div>
      <h3>Grand Soir</h3>
      <p class="price">2 500 DA</p>
      <button class="button" onclick="addToCart('Grand Soir', 2500)">

</section>

    <form onsubmit="submitOrder(event)">

</select>
      <textarea id="address" placeholder="Adresse de livraison" required></textarea>

      <button class="button" type="submit">
        Confirmer la commande
      </button>

    </form>

  </div>

</div>

<footer>
  <p>© 2026 Oud Atelier</p>
  <p>Parfums d'exception</p>
</footer>

<script>

  let cart = [];

  function addToCart(name, price) {

    const existing = cart.find(item => item.name === name);

    if (existing) {
      existing.quantity++;
    } else {
      cart.push({
        name: name,
        price: price,
        quantity: 1
      });
    }

    updateCart();

    alert(name + " ajouté au panier.");
  }

  function updateCart() {

    const items = document.getElementById("cartItems");

    items.innerHTML = "";

    let total = 0;
    let count = 0;

    cart.forEach((item, index) => {

      const subtotal = item.price * item.quantity;

      total += subtotal;
      count += item.quantity;

      items.innerHTML += `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong><br>
            ${item.quantity} × ${item.price} DA
          </div>

          <button onclick="removeItem(${index})">
            ❌
          </button>
        </div>
      `;
    });

    document.getElementById("cartTotal").innerText =
      "Total : " + total.toLocaleString() + " DA";

    document.getElementById("cartCount").innerText = count;
  }

  function removeItem(index) {

    cart.splice(index, 1);

    updateCart();
  }

  function openCart() {

    document.getElementById("cartPanel").style.display = "block";

    updateCart();
  }

  function closeCart() {

    document.getElementById("cartPanel").style.display = "none";
  }

  function submitOrder(event) {

    event.preventDefault();

    if (cart.length === 0) {
      alert("Votre panier est vide.");
      return;
    }

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const wilaya = document.getElementById("wilaya").value;
    const address = document.getElementById("address").value;

    let order = "";

    cart.forEach(item => {

      order +=
        item.name +
        " × " +
        item.quantity +
        " = " +
        (item.price * item.quantity) +
        " DA\n";
    });

    alert(
      "Commande enregistrée !\n\n" +
      "Client : " + name +
      "\nTéléphone : " + phone +
      "\nWilaya : " + wilaya +
      "\nAdresse : " + address +
      "\n\nProduits :\n" + order
    );
  }

</script>

</html>
